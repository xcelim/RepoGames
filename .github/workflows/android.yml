name: Compilar APK Android

on:
  push:
    branches: [main]
    # La web (docs/) no cambia la app: no hace falta recompilar.
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Claves de la API de juegos: se guardan en Settings → Secrets and variables → Actions
    # y se meten en la app al compilar, para que nadie tenga que configurarlas.
    env:
      # Las claves de IGDB, RAWG y Steam ya NO van dentro de la APK (se podrían sacar de ella):
      # la app usa el servidor intermedio de Supabase (supabase/functions/games), que las guarda.
      # Supabase: la URL del proyecto y la clave pública "anon" (es pública por diseño;
      # lo que protege los datos son las normas RLS de supabase/schema.sql).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Número de compilación: la app lo compara con la última versión publicada para avisar de actualizaciones.
      EXPO_PUBLIC_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Servidor intermedio para los datos de juegos
        run: |
          base=$(printf '%s' "$EXPO_PUBLIC_SUPABASE_URL" | tr -d "\"' \r\n" | sed -E 's#^(https?://)?([^/?#]+).*#https://\2#')
          echo "EXPO_PUBLIC_GAMES_PROXY_URL=${base}/functions/v1/games" >> "$GITHUB_ENV"

      - name: Comprobar las claves de la API
        run: |
          if [ -z "$EXPO_PUBLIC_IGDB_CLIENT_ID" ] && [ -z "$EXPO_PUBLIC_RAWG_KEY" ] && [ -z "$EXPO_PUBLIC_GAMES_PROXY_URL" ]; then
            echo "::warning::No hay claves de la API (IGDB_CLIENT_ID, IGDB_CLIENT_SECRET, RAWG_KEY): la app no podrá descargar juegos."
          else
            echo "Claves de la API presentes: IGDB=$([ -n "$EXPO_PUBLIC_IGDB_CLIENT_ID" ] && echo sí || echo no) RAWG=$([ -n "$EXPO_PUBLIC_RAWG_KEY" ] && echo sí || echo no) Steam=$([ -n "$EXPO_PUBLIC_STEAM_KEY" ] && echo sí || echo no)"
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan SUPABASE_URL o SUPABASE_ANON_KEY: la app guardará los datos solo en el móvil."
          else
            echo "Supabase configurado: $EXPO_PUBLIC_SUPABASE_URL"
          fi

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos, lint y tests
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Poner el número de versión
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.version='2.0.${{ github.run_number }}';j.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generar proyecto Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Firma con la clave propia de Saga Quest (secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD).
      # Sin ellos se firma con la clave de pruebas de Android, que el móvil mira con peor ojo.
      - name: Firmar con la clave de Saga Quest
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Sin clave de firma propia: la APK se firma con la clave de pruebas."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > android/app/sagaquest.jks
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  sagaquest {
                      storeFile file('sagaquest.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias 'sagaquest'
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.sagaquest } }
          }
          GRADLE
          echo "Firmada con la clave de Saga Quest"

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../SagaQuest.apk

      - name: Guardar el registro de Gradle si falla
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/log && cp gradle.log /tmp/log/ 2>/dev/null || true
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/log/gradle.log ./gradle.log
          git add -f gradle.log
          git commit -m "Registro de la compilación ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SagaQuest-apk
          path: SagaQuest.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Saga Quest 2.0 (build ${{ github.run_number }})
          body: |
            Descarga **SagaQuest.apk** en el móvil Android y ábrela para instalarla.
            Si Android avisa de «origen desconocido», permite la instalación para tu navegador.
          files: SagaQuest.apk
          make_latest: true
