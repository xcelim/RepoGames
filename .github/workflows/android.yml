name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos, lint y tests
        run: |
          npx tsc --noEmit
          npx eslint src
          npx jest --ci

      - name: Generar proyecto Android (Expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../SagaQuest.apk

      - name: Mostrar el error de Gradle
        if: failure()
        run: |
          # Resume el error como anotaciones visibles en la pestaña Actions.
          grep -n -A25 "What went wrong" gradle.log | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          grep -n -i "error:\|e: \|FAILED" gradle.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          tail -30 gradle.log | while IFS= read -r line; do echo "::warning::$line"; done

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SagaQuest-apk
          path: SagaQuest.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Saga Quest 2.0 (build ${{ github.run_number }})
          body: |
            Descarga **SagaQuest.apk** en el móvil Android y ábrela para instalarla.
            Si Android avisa de «origen desconocido», permite la instalación para tu navegador.
          files: SagaQuest.apk
          make_latest: true
