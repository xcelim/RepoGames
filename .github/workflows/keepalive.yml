# Mantiene despierto el proyecto de Supabase: el plan gratis lo pausa si pasa 7 días sin uso.
# Cada 3 días hace una consulta pequeña a la base de datos (solo lectura, con la clave pública anon).
name: Mantener Supabase despierto

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::Faltan SUPABASE_URL o SUPABASE_ANON_KEY"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "${URL%/}/rest/v1/games?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondió $code"
          if [ "$code" != "200" ]; then echo "::error::Supabase no responde bien ($code). ¿Está pausado? Reactívalo en el panel."; exit 1; fi
      # GitHub apaga las tareas programadas si el repositorio pasa 60 días sin cambios:
      # volver a activarla aquí reinicia esa cuenta.
      - name: Seguir activa
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
